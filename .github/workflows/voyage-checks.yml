name: Kuro - verificaciones del viaje
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
  push:
    branches:
      - 'feature/nave-kuro-teletransportes'
jobs:
  voyage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar rutas y teletransporte
        run: node --test tests/*.test.mjs
